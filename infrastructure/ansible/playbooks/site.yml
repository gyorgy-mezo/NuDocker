---
# Main playbook for NuDocker HTCondor + SLURM Cluster setup
# This playbook orchestrates the complete cluster configuration
# Supports dual-scheduler deployment (HTCondor + SLURM)

- name: Configure all nodes (common setup)
  hosts: all
  become: yes
  tags:
    - common
  roles:
    - common

- name: Configure HTCondor Central Manager
  hosts: central_manager
  become: yes
  tags:
    - central
    - htcondor
  roles:
    - htcondor-central

- name: Configure HTCondor Execute Nodes
  hosts: execute_nodes
  become: yes
  tags:
    - execute
    - htcondor
  roles:
    - htcondor-execute

- name: Configure SLURM Controller
  hosts: central_manager
  become: yes
  tags:
    - central
    - slurm
  roles:
    - slurm-controller
  when: enable_slurm | default(true)

- name: Configure SLURM Compute Nodes
  hosts: execute_nodes
  become: yes
  tags:
    - execute
    - slurm
  roles:
    - slurm-compute
  when: enable_slurm | default(true)

- name: Configure NuDocker environment
  hosts: all
  become: yes
  tags:
    - nudocker
  roles:
    - nudocker

- name: Verify cluster health
  hosts: central_manager
  become: yes
  tags:
    - verify
  roles:
    - cluster-verify
