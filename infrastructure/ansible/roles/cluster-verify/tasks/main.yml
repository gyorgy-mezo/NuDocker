---
# Verify HTCondor cluster health

- name: Wait for all execute nodes to register
  shell: condor_status -total | grep 'Total' | awk '{print $4}'
  register: slots_available
  retries: 10
  delay: 10
  until: slots_available.stdout | int >= 40
  changed_when: false

- name: Get HTCondor status
  command: condor_status
  register: condor_status_output
  changed_when: false

- name: Display HTCondor status
  debug:
    var: condor_status_output.stdout_lines

- name: Get pool summary
  command: condor_status -total
  register: condor_total_output
  changed_when: false

- name: Display pool summary
  debug:
    var: condor_total_output.stdout_lines

- name: Check NFS mount on execute nodes
  command: df -h /storage
  register: nfs_mount
  changed_when: false
  delegate_to: "{{ item }}"
  loop: "{{ groups['execute_nodes'] }}"

- name: Display NFS mount status
  debug:
    msg: "{{ item.item }}: {{ item.stdout_lines }}"
  loop: "{{ nfs_mount.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Verify Docker is available
  command: docker ps
  register: docker_check
  changed_when: false
  ignore_errors: yes

- name: Display Docker status
  debug:
    msg: "Docker is {{ 'available' if docker_check.rc == 0 else 'NOT available' }}"

- name: Verify Singularity is available
  command: singularity --version
  register: singularity_check
  changed_when: false
  ignore_errors: yes

- name: Display Singularity status
  debug:
    msg: "Singularity version: {{ singularity_check.stdout if singularity_check.rc == 0 else 'NOT available' }}"

- name: Check SLURM controller status
  command: scontrol ping
  register: slurm_ping
  changed_when: false
  ignore_errors: yes
  when: enable_slurm | default(true)

- name: Get SLURM cluster info
  command: sinfo
  register: sinfo_output
  changed_when: false
  ignore_errors: yes
  when: enable_slurm | default(true)

- name: Display SLURM status
  debug:
    msg: "SLURM: {{ 'Available - ' + slurm_ping.stdout if slurm_ping.rc == 0 else 'NOT available or not installed' }}"
  when: enable_slurm | default(true)

- name: Display SLURM cluster info
  debug:
    var: sinfo_output.stdout_lines
  when: enable_slurm | default(true) and sinfo_output.rc == 0

- name: Get SLURM node status
  command: sinfo -Nel
  register: slurm_nodes
  changed_when: false
  ignore_errors: yes
  when: enable_slurm | default(true)

- name: Display SLURM node details
  debug:
    var: slurm_nodes.stdout_lines
  when: enable_slurm | default(true) and slurm_nodes.rc == 0

- name: Create cluster health report
  copy:
    content: |
      NuDocker Dual-Scheduler Cluster Health Report
      ==============================================
      Generated: {{ ansible_date_time.iso8601 }}
      Cluster: {{ cluster_name }}

      HTCondor Pool Status:
      {{ condor_total_output.stdout }}

      {% if enable_slurm | default(true) and slurm_ping.rc == 0 %}
      SLURM Cluster Status:
      {{ sinfo_output.stdout }}

      SLURM Nodes:
      {{ slurm_nodes.stdout }}
      {% else %}
      SLURM: Not installed or not enabled
      {% endif %}

      Container Runtimes:
      - Docker: {{ 'Available' if docker_check.rc == 0 else 'NOT Available' }}
      - Singularity: {{ singularity_check.stdout if singularity_check.rc == 0 else 'NOT Available' }}

      Storage:
      - NFS: Mounted on all nodes at /storage

      Batch Scripts:
      - HTCondor: /storage/batch_examples/htcondor/
      - SLURM: /storage/batch_examples/slurm/
      - Common: /storage/batch_examples/common/
    dest: /storage/cluster_health_report.txt
    mode: '0644'
