---
# SLURM Compute Node Configuration
# Manages slurmd daemon on execute nodes

- name: Ensure SLURM configuration directory exists
  file:
    path: /etc/slurm
    state: directory
    owner: slurm
    group: slurm
    mode: '0755'

- name: Wait for central manager to create shared munge key
  wait_for:
    path: /storage/slurm/munge.key
    timeout: 300
  register: munge_key_wait
  retries: 3
  delay: 10

- name: Copy munge key from shared storage
  copy:
    src: /storage/slurm/munge.key
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: '0400'
    remote_src: yes

- name: Start and enable munge service
  systemd:
    name: munge
    state: started
    enabled: yes

- name: Wait for central manager to create SLURM configuration
  wait_for:
    path: /storage/slurm/slurm.conf
    timeout: 300
  register: slurm_conf_wait
  retries: 3
  delay: 10

- name: Copy SLURM configuration from shared storage
  copy:
    src: /storage/slurm/slurm.conf
    dest: /etc/slurm/slurm.conf
    owner: slurm
    group: slurm
    mode: '0644'
    remote_src: yes
  notify: restart slurmd

- name: Copy cgroup configuration from shared storage
  copy:
    src: /storage/slurm/cgroup.conf
    dest: /etc/slurm/cgroup.conf
    owner: slurm
    group: slurm
    mode: '0644'
    remote_src: yes
  notify: restart slurmd

- name: Create SLURM spool directory
  file:
    path: /var/spool/slurmd
    state: directory
    owner: slurm
    group: slurm
    mode: '0755'

- name: Create SLURM log directory
  file:
    path: /var/log/slurm
    state: directory
    owner: slurm
    group: slurm
    mode: '0755'

- name: Create SLURM run directory
  file:
    path: /var/run/slurm
    state: directory
    owner: slurm
    group: slurm
    mode: '0755'

- name: Ensure cgroup is properly configured
  lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX='
    line: 'GRUB_CMDLINE_LINUX="cgroup_enable=memory swapaccount=1"'
    backup: yes
  notify: update grub
  when: ansible_virtualization_type != "docker"

- name: Start and enable slurmd
  systemd:
    name: slurmd
    state: started
    enabled: yes

- name: Wait for slurmd to be ready
  wait_for:
    port: 6818
    host: localhost
    timeout: 60

- name: Verify slurmd is running
  command: slurmd -C
  register: slurmd_config
  changed_when: false

- name: Display slurmd configuration
  debug:
    msg: "{{ slurmd_config.stdout_lines }}"

- name: Register node with controller
  command: scontrol update nodename={{ ansible_hostname }} state=idle
  delegate_to: "{{ groups['central_manager'][0] }}"
  become: yes
  ignore_errors: yes
  changed_when: false
